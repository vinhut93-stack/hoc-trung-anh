<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Học Trung Anh Mỗi Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one narrow work column, sticky header + tab rail; cards feel like mill tags on cool sheet steel */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8ECEE; --ink:#15202A; --muted:#5A6772; --line:#D6DDE2;
  --zh:#B3322A; --zh-soft:#F6E3E1; --en:#1E5C9E; --en-soft:#E0EAF5;
  --ok:#2C7A4B; --ok-soft:#DFF0E5; --warn:#A86A12; --warn-soft:#F7ECD8;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun","PingFang SC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#1D2931; --ink:#E4EAEE; --muted:#95A3AD; --line:#2A3740;
  --zh:#E46A5F; --zh-soft:#3A2220; --en:#72A6E4; --en-soft:#1C2C40;
  --ok:#5CB883; --ok-soft:#183126; --warn:#D9A04A; --warn-soft:#352A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#1D2931; --ink:#E4EAEE; --muted:#95A3AD; --line:#2A3740;
  --zh:#E46A5F; --zh-soft:#3A2220; --en:#72A6E4; --en-soft:#1C2C40;
  --ok:#5CB883; --ok-soft:#183126; --warn:#D9A04A; --warn-soft:#352A16; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent,var(--zh));outline-offset:2px}
body.lang-zh{--accent:var(--zh);--accent-soft:var(--zh-soft)}
body.lang-en{--accent:var(--en);--accent-soft:var(--en-soft)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.streak{font-family:var(--f-mono);font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.streak b{color:var(--ink);font-size:15px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg button .han{font-family:var(--f-han)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
h2{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;text-transform:uppercase}
.tag.zh{color:var(--zh)}.tag.en{color:var(--en)}

/* today */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.lane{display:flex;flex-direction:column;gap:12px}
.lane-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lane-title{font-weight:700;font-size:16px}
.lane-title .han{font-family:var(--f-han);font-size:18px}
.share{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.count{background:var(--sunk);border-radius:8px;padding:8px 10px}
.count b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--lane);border-radius:99px}
.lane.zh{--lane:var(--zh)} .lane.en{--lane:var(--en)}
.lane .btn.go{background:var(--lane);border-color:var(--lane);color:#fff;justify-content:center}
.road{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .lv{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.step.now .lv{color:var(--lane);font-weight:500}
.step b{font-weight:600}
.step p{font-size:13px;color:var(--muted)}
.topics{display:flex;flex-direction:column;gap:10px}
.topic-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:14px}
.topic-row .mono{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* flashcard */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 20px 20px;min-height:300px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;text-align:center}
.card .topic{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted)}
.card .state{position:absolute;top:12px;right:14px}
.term{font-size:clamp(44px,13vw,72px);line-height:1.15;font-weight:700;margin-top:18px;word-break:break-word}
.term.han{font-family:var(--f-han);font-weight:700;letter-spacing:.04em}
.term.lat{font-size:clamp(30px,9vw,44px);letter-spacing:-.02em}
.reveal{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.py{font-size:20px;color:var(--accent);font-weight:500}
.hv{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--zh);border:1.5px solid var(--zh);padding:2px 8px;border-radius:4px;transform:rotate(-2deg)}
.meaning{font-size:19px;font-weight:600}
.ex{width:100%;text-align:left;background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ex .t{font-size:17px}
.ex .t.han{font-family:var(--f-han)}
.ex .p{font-size:13px;color:var(--accent)}
.ex .v{font-size:14px;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.grades .g1{color:var(--zh)} .grades .g4{color:var(--ok)}
.progress-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.speak{border:0;background:var(--accent-soft);color:var(--accent);width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.speak svg{width:18px;height:18px}
.done{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .big{font-family:var(--f-han);font-size:56px;color:var(--accent)}

/* listening */
.player{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;text-align:left;font-size:15px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--zh);background:var(--zh-soft)}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* speaking */
.shadow-text{font-size:24px;line-height:1.45}
.shadow-text.han{font-family:var(--f-han);font-size:28px}
.hidden-text{filter:blur(7px);user-select:none}
.reps{display:flex;gap:8px}
.reps span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.reps span.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* chat */
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.scen button b{font-size:14px}
.scen button span{font-size:12px;color:var(--muted)}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.log{display:flex;flex-direction:column;gap:12px;min-height:120px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:3px}
.msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-top-right-radius:3px}
.msg .t{font-size:16px;word-break:break-word}
.msg.ai .t.han{font-family:var(--f-han);font-size:18px}
.msg .p{font-size:13px;color:var(--accent)}
.msg .v{font-size:13px;color:var(--muted)}
.msg .fix{margin-top:4px;font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:7px 9px;border-left:3px solid var(--warn)}
.msg .fix.good{background:var(--ok-soft);border-left-color:var(--ok)}
.msg .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg .speak{width:30px;height:30px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;resize:vertical;min-height:46px;max-height:160px}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:14px}
@media (prefers-reduced-motion:no-preference){.card,.msg{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand">Học Trung Anh Mỗi Ngày<small>Sắt thép · thiết bị · du lịch</small></div>

  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">Hôm nay</button>
    <button role="tab" data-tab="cards" aria-selected="false">Thẻ từ</button>

  </nav>
</div></header>

const LS = "htamn-v1";
const today = () => new Date().toLocaleDateString("sv");
const dnum = k => Math.round(Date.parse(k+"T00:00:00Z")/864e5);
function fresh(){return {settings:{main:"zh",newPerDay:10,rate:1,level:"Mới bắt đầu"},cards:{},days:{},streak:{n:0,last:""},updated:0}}
let S = fresh();
try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(fresh(),JSON.parse(raw));}catch(e){}
let lang = S.settings.main;
let db=null, docRef=null, writing=false, pending=false, timer=null;

function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!docRef) return;
  clearTimeout(timer); timer=setTimeout(flush,1200);
}
async function flush(){
  if(!docRef) return;
  if(writing){pending=true;return}
  writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){}
  writing=false;
  if(pending){pending=false;flush()}
}
(async()=>{
  try{
    if(!window.claude) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){const r=snap.data(); if((r.updated||0)>(S.updated||0)){S=Object.assign(fresh(),JSON.parse(JSON.stringify(r))); lang=S.settings.main; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} render()}}
    else if(S.updated) flush();
  }catch(e){}
})();

function dayRec(){const k=today(); if(!S.days[k]) S.days[k]={rev:0,newzh:0,newen:0,listen:0,speak:0,chat:0}; return S.days[k]}
function touchStreak(){
  const k=today(); if(S.streak.last===k) return;
  S.streak.n = (S.streak.last && dnum(k)-dnum(S.streak.last)===1) ? S.streak.n+1 : 1;
  S.streak.last=k;
  const keys=Object.keys(S.days).sort(); while(keys.length>90) delete S.days[keys.shift()];
}
function streakNow(){ if(!S.streak.last) return 0; return dnum(today())-dnum(S.streak.last)<=1 ? S.streak.n : 0 }
function share(l){return l===S.settings.main?0.7:0.3}
function newCap(l){return Math.max(1,Math.round(S.settings.newPerDay*share(l)))}
function stats(l){
  const t=dnum(today()), deck=DECK[l]; let due=0,learned=0;
  for(const c of deck){const s=S.cards[c.id]; if(s){learned++; if(s.due<=t) due++}}
  const newLeft=Math.max(0,Math.min(newCap(l)-dayRec()["new"+l], deck.length-learned));
  return {due,learned,newLeft,total:deck.length};
}

/* ================= SPEECH ================= */
const synth = window.speechSynthesis;
let voices=[];
function loadVoices(){try{voices=synth?synth.getVoices():[]}catch(e){voices=[]}}
if(synth){loadVoices(); try{synth.onvoiceschanged=loadVoices}catch(e){}}
function voiceFor(l){
  const want=l==="zh"?["zh-cn","zh"]:["en-us","en-gb","en"];
  for(const w of want){const v=voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith(w)); if(v) return v}
  return null;
}
function say(text,l=lang,slow=false){
  if(!synth) return;
  try{
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=l==="zh"?"zh-CN":"en-US";
    const v=voiceFor(l); if(v) u.voice=v;
    u.rate=(slow?0.65:1)*S.settings.rate;
    synth.speak(u);
  }catch(e){}
}

/* ================= DOM HELPERS ================= */
function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){ if(v==null||v===false) continue; if(k.startsWith("on")) el[k]=v; else el.setAttribute(k,v===true?"":v) }
  for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))) }
  return el;
}

let session=null, topicFilter="all";
function buildQueue(){
  const t=dnum(today()), deck=DECK[lang].filter(c=>topicFilter==="all"||c.topic===topicFilter);
  const due=deck.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const left=Math.max(0,newCap(lang)-dayRec()["new"+lang]);
  const nw=deck.filter(c=>!S.cards[c.id]).slice(0,left);
  const q=[]; let i=0,j=0; // interleave: 2 reviews then 1 new
  while(i<due.length||j<nw.length){ if(i<due.length)q.push(due[i++]); if(i<due.length)q.push(due[i++]); if(j<nw.length)q.push(nw[j++]) }
  return q;
}
function extraQueue(){ // practice beyond today's plan: soonest-due learned cards, then more new
  const deck=DECK[lang].filter(c=>topicFilter==="all"||c.topic===topicFilter);
  const learned=deck.filter(c=>S.cards[c.id]).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,10);
  const nw=deck.filter(c=>!S.cards[c.id]).slice(0,5);
  return [...nw,...learned];
}
function grade(card,g){
  const t=dnum(today()), d=dayRec(); let s=S.cards[card.id];
  if(!s){ s={iv:0,ef:2.5,reps:0,lapses:0,due:t}; S.cards[card.id]=s; d["new"+lang]++ }
  if(g===1){ s.reps=0; s.iv=0; s.ef=Math.max(1.3,s.ef-0.2); s.lapses++; s.due=t }
  else{
    if(s.reps===0) s.iv = g===4?3:1;
    else if(s.reps===1) s.iv = g===2?2:g===3?3:6;
    else s.iv = Math.max(s.iv+1, Math.round(s.iv*s.ef*(g===2?0.6:g===4?1.3:1)));
    s.ef = Math.max(1.3, s.ef + (g===2?-0.15:g===4?0.15:0));
    s.reps++; s.due=t+s.iv;
  }
  d.rev++; touchStreak(); save();
}
function preview(card,g){
  const s=S.cards[card.id];
  if(g===1) return "lại";
  if(!s||s.reps===0) return (g===4?3:1)+" ngày";
  if(s.reps===1) return (g===2?2:g===3?3:6)+" ngày";
  return Math.max(s.iv+1,Math.round(s.iv*s.ef*(g===2?0.6:g===4?1.3:1)))+" ngày";
}

      h("button",{class:"btn"+(SP.reps>=3?" primary":""),onclick:()=>{SP={lang,i:(SP.i+1+Math.floor(Math.random()*(deck.length-1)))%deck.length,reps:0,hide:false};render()}},"Câu khác"))));

  return root;
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function norm(s,l){ s=s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,""); return l==="zh"? [...s.replace(/\s/g,"")] : s.split(/\s+/).filter(Boolean) }
function lcs(a,b){ const d=Array(b.length+1).fill(0); for(const x of a){ let prev=0; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]= x===b[j-1]? prev+1 : Math.max(d[j],d[j-1]); prev=t } } return d[b.length] }
function MicBox(c){
  const out=h("div",{class:"ex",style:SP.heard?"":"display:none"});
  if(SP.heard){
    const sc=SP.score, col=sc>=85?"var(--ok)":sc>=60?"var(--warn)":"var(--zh)";
    out.append(h("span",{class:"mono",style:`color:${col};font-weight:500`},`Điểm: ${sc}/100`),
      h("span",{class:"t"+(lang==="zh"?" han":"")},"Máy nghe được: "+(SP.heard||"…")),
      h("span",{class:"v"},sc>=85?"Rất tốt! Người bản xứ sẽ hiểu bạn.":sc>=60?"Khá ổn. Nghe chậm lại câu mẫu và chú ý những chữ bị nghe sai.":"Chưa rõ. Nghe chậm, nói chậm từng cụm rồi thử lại."));
  }
  const btn=h("button",{class:"btn primary",onclick:()=>{
    try{
      const r=new SR(); r.lang=lang==="zh"?"zh-CN":"en-US"; r.interimResults=false; r.maxAlternatives=3;
      btn.disabled=true; btn.textContent="Đang nghe… hãy nói";
      r.onresult=e=>{
        const target=norm(c.ex,lang); let best="",bs=0;
        for(const alt of e.results[0]){ const g=norm(alt.transcript,lang); const s=Math.round(200*lcs(target,g)/(target.length+g.length||1)); if(s>=bs){bs=s;best=alt.transcript} }
        SP.heard=best; SP.score=bs; if(SP.reps<3){SP.reps++; if(SP.reps===3){dayRec().speak++;touchStreak();save()}}
      };
      r.onerror=e=>{SP.heard=e.error==="not-allowed"?"(Chưa cho phép dùng micro. Bấm biểu tượng ổ khóa trên thanh địa chỉ để bật.)":"(Không nghe rõ, thử lại nhé.)"; SP.score=0};
      r.onend=()=>render();
      r.start();
    }catch(e){btn.disabled=false; btn.textContent="Nói vào micro để chấm"}
  }},"Nói vào micro để chấm");
  return h("div",{class:"stack"},btn,out);
}

function rules(sc){

  return `You are a role-play partner helping a Vietnamese adult practise ${zh?"Mandarin Chinese (simplified characters)":"English"}. The learner works in steel and industrial-equipment trading and is at level: ${S.settings.level}.
Scenario: ${sc.d}
You play: ${sc.role}. The learner plays the Vietnamese customer/visitor. Stay in character.
Keep each reply to 1–3 short sentences. Match the learner's level but use real trade terms naturally. Ask a question to keep the conversation going.
The learner may write in ${zh?"Chinese (characters or pinyin)":"English"}, or in Vietnamese when stuck. Always reply in character in ${zh?"Chinese":"English"}.
Reply in EXACTLY this format, each label at the start of its own line, no markdown, nothing else:
REPLY: <your in-character reply>
${zh?"PINYIN: <pinyin with tone marks for REPLY>\n":""}VI: <Vietnamese translation of REPLY>
FIX: <in Vietnamese. If the learner's last message had mistakes, was unnatural, or was in Vietnamese, give the correct natural ${zh?"Chinese (with pinyin)":"English"} version and a one-line reason. Otherwise write exactly: Tốt>`;
}
function parse(text){
  const get=k=>{const m=text.match(new RegExp("^"+k+":\\s*([\\s\\S]*?)(?=^\\s*(?:REPLY|PINYIN|VI|FIX|SAY):|$(?![\\s\\S]))","m")); return m?m[1].trim():""};
  const r={reply:get("REPLY")||get("SAY"),py:get("PINYIN"),vi:get("VI"),fix:get("FIX")};
  if(!r.reply&&!r.vi) r.reply=text.trim();
  return r;
}

  if(c==="rate_limited") return "Bạn gửi hơi nhanh hoặc đã chạm giới hạn sử dụng. Đợi một lát rồi thử lại.";
  if(c==="session_expired") return "Phiên đăng nhập đã hết. Hãy đăng nhập lại Claude.";
  if(c==="refused") return "AI không trả lời câu này. Thử diễn đạt khác.";
  return "Kết nối bị gián đoạn. Bấm gửi lại.";
}
async function ask(extraUser){
  const st=CH[lang]; if(st.busy) return;
  const sc=SCEN[lang].find(s=>s.id===st.scen);
  if(extraUser) st.turns.push({role:"user",content:extraUser,me:true});
  const ai={role:"assistant",content:"",pending:true}; st.turns.push(ai); st.busy=true; st.hint=null; render();
  ctl=new AbortController();
  const msgs=[{role:"user",content:rules(sc)},{role:"user",content:"(Bắt đầu: hãy mở đầu cuộc hội thoại.)"}];
  st.turns.filter(t=>!t.pending).slice(-16).forEach(t=>msgs.push({role:t.role,content:t.content}));
  if(msgs[msgs.length-1].role!=="user") msgs.push({role:"user",content:"(Tiếp tục.)"});
  try{
    const r=await sampleFn(msgs,{modelTier:"quick",cache:false,signal:ctl.signal,onText:({text})=>{ai.content=text;updatePending(ai)}});
    ai.content=r.text; ai.pending=false;
    dayRec().chat++; touchStreak(); save();
  }catch(e){
    st.turns.pop();
    if(e&&e.code!=="cancelled") st.error=errCopy(e);
  }
  st.busy=false; render();
  const last=st.turns[st.turns.length-1];
  if(last&&last.role==="assistant"&&S.settings.autoSpeak!==false) say(parse(last.content).reply,lang);
}
function updatePending(ai){
  const el=document.getElementById("pendingMsg"); if(!el) return;
  const p=parse(ai.content); el.querySelector(".t").textContent=p.reply||"…";
}
async function hint(){
  const st=CH[lang]; if(st.busy) return; st.busy=true; st.hint={loading:true}; render();
  const sc=SCEN[lang].find(s=>s.id===st.scen);
  const convo=st.turns.map(t=>(t.role==="user"?"LEARNER: ":"PARTNER: ")+(t.role==="user"?t.content:parse(t.content).reply)).join("\n");
  const zh=lang==="zh";
  const prompt=`A Vietnamese learner (level: ${S.settings.level}) is practising ${zh?"Mandarin Chinese":"English"} in this role-play: ${sc.d}
Conversation so far:
${convo||"(nothing yet)"}
Suggest ONE natural, short reply the learner could say next, at their level.
Answer in EXACTLY this format, nothing else:
SAY: <the reply in ${zh?"Chinese characters":"English"}>
${zh?"PINYIN: <pinyin with tone marks>\n":""}VI: <Vietnamese meaning>`;
  try{ const r=await sampleFn(prompt,{modelTier:"quick",cache:false}); st.hint=parse(r.text) }
  catch(e){ st.hint=null; if(e&&e.code!=="cancelled") st.error=errCopy(e) }
  st.busy=false; render();
}
function Chat(){
  const st=CH[lang], root=h("div",{class:"stack"});
  root.append(h("h2",{},`Hội thoại AI · ${LN[lang]}`),
    h("p",{class:"muted"},"Chọn một tình huống. AI đóng vai đối tác, trả lời kèm phiên âm và nghĩa, đồng thời sửa câu của bạn. Bí quá thì gõ tiếng Việt hoặc bấm “Gợi ý”."));
  if(!sampleReady){ root.append(h("p",{class:"note"},"Đang kết nối AI…")); return root }
  if(!sampleFn||sampleBlocked){ root.append(h("p",{class:"note"},(window.claude?"Tính năng hội thoại AI cần bạn cho phép dùng AI trong Claude.":"Hội thoại AI sẽ được bật ở bước tiếp theo, khi kết nối app với AI qua API key. Các phần Thẻ từ, Nghe, Nói đã dùng được ngay."))); return root }
  const grid=h("div",{class:"scen"});
  SCEN[lang].forEach(sc=>grid.append(h("button",{"aria-pressed":st.scen===sc.id,disabled:st.busy,onclick:()=>{ if(st.scen===sc.id) return; st.scen=sc.id; st.turns=[]; st.hint=null; st.error=null; ask() }},h("b",{},sc.t),h("span",{},sc.d))));
  root.append(grid);
  if(!st.scen) return root;
  const log=h("div",{class:"log panel"});
  st.turns.forEach(t=>{
    if(t.role==="user"){ log.append(h("div",{class:"msg me"},h("span",{class:"t"},t.content))); return }
    const p=parse(t.content);
    if(t.pending){ log.append(h("div",{class:"msg ai",id:"pendingMsg"},h("span",{class:"t"+(lang==="zh"?" han":"")},p.reply||"Đang nghĩ…"))); return }
    const good=!p.fix||/^tốt\.?$/i.test(p.fix.trim());
    log.append(h("div",{class:"msg ai"},
      h("div",{class:"head"},h("span",{class:"t"+(lang==="zh"?" han":"")},p.reply),speakBtn(p.reply,lang)),
      p.py?h("span",{class:"p"},p.py):null,
      p.vi?h("span",{class:"v"},p.vi):null,
      st.turns.indexOf(t)>0&&p.fix?h("div",{class:"fix"+(good?" good":"")},good?"Câu của bạn ổn.":"Sửa: "+p.fix):null));
  });
  root.append(log);
  if(st.error) root.append(h("p",{class:"note"},st.error));
  if(st.hint) root.append(st.hint.loading?h("div",{class:"hint"},"Đang tìm gợi ý…"):h("div",{class:"hint"},
    h("div",{class:"head row",style:"justify-content:space-between;flex-wrap:nowrap"},h("span",{class:"t"+(lang==="zh"?" han":""),style:"font-size:17px"},st.hint.reply),speakBtn(st.hint.reply,lang)),
    st.hint.py?h("span",{class:"p",style:"color:var(--accent);font-size:13px"},st.hint.py):null,
    h("span",{class:"muted",style:"font-size:13px"},st.hint.vi)));
  const ta=h("textarea",{id:"chatIn",rows:"2",placeholder:lang==="zh"?"Gõ tiếng Trung, pinyin hoặc tiếng Việt…":"Type in English (or Vietnamese if stuck)…",disabled:st.busy});
  const send=()=>{const v=ta.value.trim(); if(!v) return; st.error=null; ask(v)};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
  root.append(h("div",{class:"compose"},ta,h("button",{class:"btn primary",disabled:st.busy,onclick:send},"Gửi")));
  root.append(h("div",{class:"row"},
    h("button",{class:"btn",disabled:st.busy,onclick:hint},"Gợi ý câu trả lời"),
    st.busy?h("button",{class:"btn ghost",onclick:()=>ctl&&ctl.abort()},"Dừng"):null,
    h("button",{class:"btn ghost",disabled:st.busy,onclick:()=>{st.turns=[];st.hint=null;st.error=null;ask()}},"Bắt đầu lại")));
  return root;
}

/* ================= SETTINGS ================= */
function Settings(){
  const st=S.settings, root=h("div",{class:"stack"});
  const sel=(id,label,val,opts,on)=>h("label",{class:"field",for:id},label,
    (()=>{const s=h("select",{id}); opts.forEach(([v,t])=>{const o=h("option",{value:v},t); if(String(v)===String(val)) o.selected=true; s.append(o)}); s.onchange=()=>on(s.value); return s})());
  root.append(h("h2",{},"Cài đặt"),
    h("div",{class:"panel stack"},
      sel("setMain","Ngôn ngữ chính (70% thời gian)",st.main,[["zh","Tiếng Trung"],["en","Tiếng Anh"]],v=>{st.main=v;save();render()}),
      sel("setNew","Số từ mới mỗi ngày (tổng cả hai thứ tiếng)",st.newPerDay,[[6,"6 · nhẹ nhàng"],[10,"10 · vừa phải"],[15,"15 · tăng tốc"],[20,"20 · chuyên sâu"]],v=>{st.newPerDay=+v;save();render()}),
      sel("setRate","Tốc độ giọng đọc",st.rate,[[0.8,"Chậm"],[1,"Bình thường"],[1.15,"Nhanh"]],v=>{st.rate=+v;save()}),
      sel("setLevel","Trình độ (để AI nói cho vừa sức)",st.level,[["Mới bắt đầu","Mới bắt đầu"],["Sơ trung cấp","Sơ trung cấp"],["Trung cấp","Trung cấp"],["Khá","Khá"]],v=>{st.level=v;save()}),
      sel("setAuto","Tự đọc to câu trả lời của AI",st.autoSpeak===false?"0":"1",[["1","Bật"],["0","Tắt"]],v=>{st.autoSpeak=v==="1";save()})),
    h("p",{class:"note"}, docRef?"Tiến độ được lưu vào tài khoản Claude của bạn, mở ở máy khác vẫn còn.":"Tiến độ đang được lưu trên trình duyệt này."));
  const confirmBox=h("div",{class:"row"});
  const ask0=()=>{confirmBox.replaceChildren(h("span",{class:"muted"},"Xóa hết tiến độ học?"),
    h("button",{class:"btn",style:"color:var(--zh)",onclick:()=>{const keep=S.settings; S=fresh(); S.settings=keep; save(); render()}},"Xóa"),
    h("button",{class:"btn ghost",onclick:()=>confirmBox.replaceChildren(btn0)},"Hủy"))};
  const btn0=h("button",{class:"btn ghost",onclick:ask0},"Xóa tiến độ và học lại từ đầu");
  confirmBox.append(btn0);
  if(!window.claude){
    const msg=h("span",{class:"muted",style:"font-size:13px"});
    const file=h("input",{type:"file",id:"importFile",accept:".json,application/json",hidden:true});
    file.onchange=()=>{const f=file.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{try{const d=JSON.parse(rd.result); if(!d.cards||!d.settings) throw 0; S=Object.assign(fresh(),d); lang=S.settings.main; save(); render()}catch(e){msg.textContent="File không đúng định dạng sao lưu của app."}}; rd.readAsText(f)};
    root.append(h("div",{class:"panel stack"},h("h3",{},"Sao lưu tiến độ"),
      h("p",{class:"muted",style:"font-size:13px"},"Bản offline lưu tiến độ trong trình duyệt. Nếu xóa dữ liệu trình duyệt hoặc đổi máy, tiến độ sẽ mất. Thỉnh thoảng hãy tải file sao lưu, khi cần thì nạp lại."),
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>{const a=h("a",{href:URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),download:"tien-do-hoc-"+today()+".json"}); document.body.append(a); a.click(); a.remove(); msg.textContent="Đã tải file sao lưu."}},"Tải file sao lưu"),
        h("button",{class:"btn",onclick:()=>file.click()},"Nạp file sao lưu"),file),msg));
  }
  root.append(confirmBox);
  return root;
}

render();
