<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#B3322A">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Học Trung Anh Mỗi Ngày</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one narrow work column; sticky slim header, fixed bottom nav for thumbs; lessons run full-screen with a bottom action sheet */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --sunk:#E8ECEE; --ink:#15202A; --muted:#5A6772; --line:#D6DDE2;
  --zh:#B3322A; --zh-soft:#F6E3E1; --en:#1E5C9E; --en-soft:#E0EAF5;
  --ok:#2C7A4B; --ok-soft:#DFF0E5; --bad:#B8322A; --bad-soft:#F8E1DF; --warn:#A86A12; --warn-soft:#F7ECD8;
  --t1:#D1402F; --t2:#C97412; --t3:#2E8B4A; --t4:#2D68C4; --t5:#86919A;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-han:"Noto Serif SC","Songti SC","SimSun","PingFang SC",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --on-accent:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1418; --surface:#162027; --sunk:#1D2931; --ink:#E4EAEE; --muted:#95A3AD; --line:#2A3740;
  --zh:#E46A5F; --zh-soft:#3A2220; --en:#72A6E4; --en-soft:#1C2C40;
  --ok:#5CB883; --ok-soft:#183126; --bad:#EE7A6E; --bad-soft:#3A2220; --warn:#D9A04A; --warn-soft:#352A16;
  --t1:#F07A6C; --t2:#F0A54A; --t3:#5FC27F; --t4:#74A6F0; --t5:#8E9BA5; --on-accent:#0E1418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1418; --surface:#162027; --sunk:#1D2931; --ink:#E4EAEE; --muted:#95A3AD; --line:#2A3740;
  --zh:#E46A5F; --zh-soft:#3A2220; --en:#72A6E4; --en-soft:#1C2C40;
  --ok:#5CB883; --ok-soft:#183126; --bad:#EE7A6E; --bad-soft:#3A2220; --warn:#D9A04A; --warn-soft:#352A16;
  --t1:#F07A6C; --t2:#F0A54A; --t3:#5FC27F; --t4:#74A6F0; --t5:#8E9BA5; --on-accent:#0E1418; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent,var(--zh));outline-offset:2px}
body.lang-zh{--accent:var(--zh);--accent-soft:var(--zh-soft)}
body.lang-en{--accent:var(--en);--accent-soft:var(--en-soft)}
.han{font-family:var(--f-han)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{font-family:var(--f-mono);font-size:12px;display:flex;align-items:baseline;gap:4px;color:var(--muted);white-space:nowrap}
.streak b{color:var(--ink);font-size:15px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);flex:none}
.pill-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bottom button{border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.bottom svg{width:24px;height:24px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
body.lesson-mode nav.bottom,body.lesson-mode header.top{display:none}

main{display:flex;flex-direction:column;gap:20px;padding-top:18px;padding-bottom:110px}
h2{font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.big{width:100%;padding:13px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;text-transform:uppercase}
.tag.zh{color:var(--zh)}.tag.en{color:var(--en)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ipa{font-family:var(--f-mono);color:var(--muted);font-size:15px}

/* pinyin tones */
.pyw{font-weight:500}
.tc .pyw .t1{color:var(--t1)} .tc .pyw .t2{color:var(--t2)} .tc .pyw .t3{color:var(--t3)} .tc .pyw .t4{color:var(--t4)} .tc .pyw .t5{color:var(--t5)}
body.nopy .pyw:not(.keep){display:none}
.pyw.big{font-size:22px}

/* home */
.goal{display:flex;flex-direction:column;gap:8px}
.next{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.next .eyebrow{color:var(--on-accent);opacity:.85}
.next h2{color:var(--on-accent);font-size:23px}
.next .preview{font-family:var(--f-han);font-size:20px;opacity:.95;word-break:break-word}
.next .preview.lat{font-family:var(--f-body);font-size:16px}
.next .btn{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent);font-size:16px;padding:13px;margin-top:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.tile-card .k{font-size:12px;color:var(--muted);font-weight:600}
.tile-card .n{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.tile-card .t{font-size:15px;line-height:1.3}

/* path */
.path{display:flex;flex-direction:column;gap:16px}
.unit{display:flex;flex-direction:column;gap:4px}
.unit-h{display:flex;flex-direction:column;padding-left:2px}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.lessons::before{content:"";position:absolute;left:19px;top:24px;bottom:24px;width:2px;background:var(--line)}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;background:none;border:0;text-align:left;width:100%}
.lt{display:flex;flex-direction:column;min-width:0}
.lt b{font-weight:600}
.lt .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.han-s{font-family:var(--f-han)}
.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-weight:500;font-size:14px;position:relative;z-index:1;color:var(--muted)}
.node svg{width:18px;height:18px}
.lrow.done .node{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.lrow.cur .node{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lrow.locked .lt{opacity:.55}
.lr{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-family:var(--f-body);font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
.road{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .lv{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.step.now .lv{color:var(--accent);font-weight:500}
.step p{font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:600}

/* cards / words */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;text-align:center}
.card .topic{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted)}
.card .state{position:absolute;top:12px;right:14px}
.term{font-size:clamp(44px,13vw,72px);line-height:1.15;font-weight:700;margin-top:14px;word-break:break-word;cursor:pointer}
.term.han{font-family:var(--f-han);letter-spacing:.04em}
.term.lat{font-size:clamp(30px,9vw,44px);letter-spacing:-.02em}
.hv{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--zh);border:1.5px solid var(--zh);padding:2px 8px;border-radius:4px;transform:rotate(-2deg)}
.meaning{font-size:19px;font-weight:600}
.ex{width:100%;text-align:left;background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.ex .t{font-size:17px}
.ex .t.han{font-family:var(--f-han)}
.ex .v{font-size:14px;color:var(--muted)}
.ex .pyw{font-size:13px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.grades .g1{color:var(--bad)} .grades .g4{color:var(--ok)}
.progress-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.speak{border:0;background:var(--accent-soft);color:var(--accent);width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.speak svg{width:18px;height:18px}
.fin{text-align:center;padding:24px 4px;display:flex;flex-direction:column;gap:12px;align-items:center}
.fin .big{font-family:var(--f-han);font-size:60px;line-height:1.1;color:var(--accent)}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.count{background:var(--sunk);border-radius:10px;padding:10px}
.count b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.count span{font-size:12px;color:var(--muted)}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;text-align:left;font-size:16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt.center{align-items:center;text-align:center}
.opt .han{font-size:26px;line-height:1.25}
.opt .pyw{font-size:13px}
.opt.pyopt{font-size:20px;align-items:center}
.opt.pyopt .pyw{font-size:20px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:inherit}
.score{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.player{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bigplay{width:84px;height:84px;border-radius:24px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.bigplay svg{width:36px;height:36px}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:18px;padding-bottom:220px}
.ltop{display:flex;align-items:center;gap:12px;padding-top:6px}
.ltop .meter{flex:1}
.icon-btn{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px;flex:none}
.icon-btn svg{width:22px;height:22px}
.qtitle{font-size:19px;font-weight:700;text-wrap:balance}
.qterm{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.qterm .term{margin-top:0}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.ans-zone{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{border:1.5px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px}
.tile.han{font-family:var(--f-han);font-size:20px}
.tile.used{visibility:hidden}
.actionbar,.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.actionbar .in,.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sheet.ok{background:var(--ok-soft);border-top:3px solid var(--ok)}
.sheet.bad{background:var(--bad-soft);border-top:3px solid var(--bad)}
.sheet-t{font-size:18px}
.sheet.ok .sheet-t{color:var(--ok)} .sheet.bad .sheet-t{color:var(--bad)}
.sheet.ok .btn.primary{background:var(--ok);border-color:var(--ok)}
.sheet.bad .btn.primary{background:var(--bad);border-color:var(--bad)}
.sheet-a{font-size:15px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.sheet-a .han{font-size:19px}
.quit{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* pronunciation info */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.tcard{display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 12px;align-items:start}
.tcard .desc{grid-column:1 / -1;font-size:14px;color:var(--muted)}
.tcard .head{display:flex;flex-direction:column}
.tsvg svg{display:block}
.srows{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow .code{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--accent)}
.srow .tx{font-size:14px}
.sayb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
.sayb .han{font-size:18px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* speaking / chat */
.shadow-text{font-size:24px;line-height:1.45}
.shadow-text.han{font-family:var(--f-han);font-size:28px}
.hidden-text{filter:blur(7px);user-select:none}
.reps{display:flex;gap:8px}
.reps span{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.reps span.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.scen button b{font-size:14px}
.scen button span{font-size:12px;color:var(--muted)}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.log{display:flex;flex-direction:column;gap:12px;min-height:120px}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.ai{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:3px}
.msg.me{background:var(--accent);color:var(--on-accent);align-self:flex-end;border-top-right-radius:3px}
.msg .t{font-size:16px;word-break:break-word}
.msg.ai .t.han{font-family:var(--f-han);font-size:18px}
.msg .v{font-size:13px;color:var(--muted)}
.msg .fix{margin-top:4px;font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:7px 9px;border-left:3px solid var(--warn)}
.msg .fix.good{background:var(--ok-soft);border-left-color:var(--ok)}
.msg .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.msg .speak{width:30px;height:30px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;resize:vertical;min-height:46px;max-height:160px}
.hint{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:15px}
@media (prefers-reduced-motion:no-preference){.card,.msg,.sheet{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand">Học Trung Anh</div>
    <div class="streak" title="Chuỗi ngày học liên tục"><b id="streakN">0</b> ngày</div>
    <button class="pill-btn" id="pyToggle" aria-pressed="true" title="Hiện hoặc ẩn pinyin">Pinyin</button>
    <div class="seg" role="group" aria-label="Ngôn ngữ">
      <button id="langZh" aria-pressed="true"><span class="han">中文</span></button>
      <button id="langEn" aria-pressed="false">EN</button>
    </div>
  </div>
</div></header>

function segRun(run){
  const base=[],tone=[];
  run.forEach(c=>{const m=TONE_MAP[c]; base.push(m?m[0]:c.toLowerCase()); tone.push(m?m[1]:0)});
  const n=run.length,best=Array(n+1).fill(1e9),prev=Array(n+1).fill(-1); best[0]=0;
  for(let i=0;i<n;i++){ if(best[i]>=1e9) continue;
    for(let j=i+1;j<=Math.min(n,i+7);j++){
      if(!SYL.has(base.slice(i,j).join(""))) continue;
      if(tone.slice(i,j).filter(Boolean).length>1) continue;
      if(best[i]+1<best[j]){best[j]=best[i]+1;prev[j]=i}
    }}
  if(best[n]>=1e9) return [{text:run.join("")}];
  const segs=[]; for(let j=n;j>0;j=prev[j]) segs.unshift([prev[j],j]);
  return segs.map(([i,j])=>({raw:run.slice(i,j).join(""),s:base.slice(i,j).join(""),t:tone.slice(i,j).find(Boolean)||5,cap:run[i]!==run[i].toLowerCase()}));

    const run=[];while(i<ch.length&&isPyChar(ch[i]))run.push(ch[i++]);
    out.push(...segRun(run));

}

function voiceFor(l){
  const want=l==="zh"?["zh-cn","cmn-hans","zh-hans","zh"]:["en-us","en-gb","en"];
  for(const w of want){const v=voices.find(v=>{const g=v.lang.replace("_","-").toLowerCase(); return g.startsWith(w)&&!/hk|yue|tw/.test(g)}); if(v) return v}

let audioEl=null;
function sayOnline(text,l,slow){
  try{
    if(!audioEl){audioEl=new Audio();audioEl.preload="auto";try{audioEl.referrerPolicy="no-referrer"}catch(e){}}
    const tl=l==="zh"?"zh-CN":"en",parts=[]; let buf="";
    for(const ch of text){buf+=ch; if(buf.length>=180||(/[。！？.!?，,；;]/.test(ch)&&buf.length>60)){parts.push(buf);buf=""}}
    if(buf.trim()) parts.push(buf);
    const srcs=q=>{const e=encodeURIComponent(q); const a=["https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+tl+"&ttsspeed="+(slow?"0.4":"1")+"&q="+e];
      a.push("https://dict.youdao.com/dictvoice?le="+(l==="zh"?"zh":"eng")+"&audio="+e); return a};
    let i=0;
    const playPart=(q,k)=>{ const list=srcs(q); if(k>=list.length){next();return}
      audioEl.src=list[k]; audioEl.playbackRate=(slow&&k>0)?0.7:(slow?1:S.settings.rate);
      audioEl.onended=next; audioEl.onerror=()=>playPart(q,k+1);
      const p=audioEl.play(); if(p&&p.catch) p.catch(err=>{ if(err&&err.name==="NotSupportedError") playPart(q,k+1) });
    };
    const next=()=>{ if(i>=parts.length) return; playPart(parts[i++],0) };
    next();
  }catch(e){}
}

function mergeT(t,max){

    t.splice(bi,2,t[bi]+(/[a-z]$/i.test(t[bi])&&/^[a-z]/i.test(t[bi+1])?" ":"")+t[bi+1])}
  return t;
}
function tilesFor(c,l){
  if(l==="zh"){
    DICT=DICT||new Set([...DECK.zh.map(x=>x.term),...COMMON]);
    const ch=[...c.ex.replace(/[，。！？、；：,.!?\s]/g,"")],t=[]; let i=0;
    while(i<ch.length){
      if(/[0-9A-Za-z]/.test(ch[i])){let r="";while(i<ch.length&&/[0-9A-Za-z]/.test(ch[i]))r+=ch[i++];t.push(r);continue}
      let m=1; for(let k=Math.min(6,ch.length-i);k>1;k--){if(DICT.has(ch.slice(i,i+k).join(""))){m=k;break}}
      t.push(ch.slice(i,i+m).join("")); i+=m;
    }

  }
  const t=c.ex.replace(/[.!?,]/g,"").split(/\s+/).filter(Boolean); mergeT(t,7);

}

  const cand=shuffle(pool).find(w=>!toks.includes(w)&&!c.ex.includes(w)&&w.length<=6);

}

}

    if(x.pron==="tones") shuffle(TONE_SETS).forEach(set=>{const t=Math.floor(Math.random()*4); items.push({k:"tone",say:set[t],correct:markTone(set[4],t+1),opts:[1,2,3,4].map(n=>markTone(set[4],n)),reveal:set[t]})});

    if(x.pron==="sandhi") shuffle(DECK.zh.filter(c=>sylCount(c.py)===2)).slice(0,8).forEach(c=>{const v=pyVariants(c.py); items.push({k:"tone",say:c.term,correct:v.correct,opts:v.opts,reveal:c.term,c})});

/* ================= REVIEW (FLASHCARDS) ================= */
let session=null,topicFilter="all";
function buildQueue(){
  const t=dnum(today());
  return DECK[lang].filter(c=>(topicFilter==="all"||c.topic===topicFilter)&&S.cards[c.id]&&S.cards[c.id].due<=t).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
}
function extraQueue(){
  const deck=DECK[lang].filter(c=>topicFilter==="all"||c.topic===topicFilter);
  const learned=deck.filter(c=>S.cards[c.id]).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,10);
  return learned.length?learned:deck.filter(c=>!S.cards[c.id]).slice(0,5);
}
function grade(card,g){
  const t=dnum(today()),d=dayRec(); let s=S.cards[card.id];
  if(!s){s={iv:0,ef:2.5,reps:0,lapses:0,due:t};S.cards[card.id]=s;d["new"+lang]=(d["new"+lang]||0)+1}
  if(g===1){s.reps=0;s.iv=0;s.ef=Math.max(1.3,s.ef-0.2);s.lapses++;s.due=t}
  else{
    if(s.reps===0) s.iv=g===4?3:1;
    else if(s.reps===1) s.iv=g===2?2:g===3?3:6;
    else s.iv=Math.max(s.iv+1,Math.round(s.iv*s.ef*(g===2?0.6:g===4?1.3:1)));
    s.ef=Math.max(1.3,s.ef+(g===2?-0.15:g===4?0.15:0)); s.reps++; s.due=t+s.iv;
  }
  d.rev++; addXP(1);
}
function preview(card,g){
  const s=S.cards[card.id]; if(g===1) return "lại";
  if(!s||s.reps===0) return (g===4?3:1)+" ngày";
  if(s.reps===1) return (g===2?2:g===3?3:6)+" ngày";
  return Math.max(s.iv+1,Math.round(s.iv*s.ef*(g===2?0.6:g===4?1.3:1)))+" ngày";
}

let SP=null;
function Speak(){
  const deck=DECK[lang];
  if(!SP||SP.lang!==lang) SP={lang,i:Math.floor(Math.random()*deck.length),reps:0,hide:false,res:null};
  const c=deck[SP.i],root=h("div",{class:"stack"}),zh=lang==="zh";
  root.append(h("h2",{},"Nói theo · Shadowing"),h("p",{class:"muted"},"Nghe câu mẫu rồi nói to theo ngay, bắt chước cả ngữ điệu. Lặp 3 lần. Lần cuối thử che chữ và nói theo trí nhớ."));
  const vn=voiceNote(lang); if(vn) root.append(vn);
  const reps=h("div",{class:"reps"}); for(let k=1;k<=3;k++) reps.append(h("span",{class:k<=SP.reps?"on":""},k));
  const rep=()=>{if(SP.reps<3){SP.reps++; if(SP.reps===3){dayRec().speak++;addXP(1)}}};
  const mic=SR?h("button",{class:"btn primary",onclick:()=>listenMic(c.ex,lang,res=>{SP.res=res;if(!res.err)rep();render()},mic)},"Nói vào micro để chấm"):null;
  root.append(h("div",{class:"panel stack"},
    h("div",{class:"shadow-text"+(zh?" han":"")+(SP.hide?" hidden-text":"")},c.ex),
    zh?h("div",{class:SP.hide?"hidden-text":""},py(c.exPy)):null,
    h("div",{class:"muted"},c.exVi),
    h("div",{class:"row"},h("button",{class:"btn primary",onclick:()=>say(c.ex,lang)},"Nghe mẫu"),h("button",{class:"btn",onclick:()=>say(c.ex,lang,true)},"Nghe chậm"),
      h("button",{class:"btn ghost",onclick:()=>{SP.hide=!SP.hide;render()}},SP.hide?"Hiện chữ":"Che chữ")),
    h("div",{class:"row between"},reps,h("button",{class:"btn",disabled:SP.reps>=3,onclick:()=>{rep();render()}},"Tôi đã nói 1 lần")),
    mic, SP.res?micResult(SP.res,lang):null,
    h("div",{class:"row"},h("button",{class:"btn"+(SP.reps>=3?" primary":""),onclick:()=>{SP={lang,i:(SP.i+1+Math.floor(Math.random()*(deck.length-1)))%deck.length,reps:0,hide:false,res:null};render()}},"Câu khác"))));
  root.append(h("p",{class:"note"},SR?"Chấm phát âm dùng nhận dạng giọng nói của trình duyệt (tốt nhất trên Chrome). Điểm chỉ để tham khảo: máy nhận đúng chữ nghĩa là người nghe cũng hiểu bạn."
    :"Trình duyệt này chưa hỗ trợ chấm phát âm. Hãy mở bằng Chrome trên máy tính hoặc Android. Trong lúc đó, bạn có thể ghi âm giọng mình rồi nghe lại so với câu mẫu."));
  return root;
}
let TD=null,tdScore={r:0,t:0};
function newTD(){
  if(Math.random()<.5){const set=pick(TONE_SETS),t=Math.floor(Math.random()*4); TD={say:set[t],correct:markTone(set[4],t+1),opts:[1,2,3,4].map(n=>markTone(set[4],n)),reveal:set[t],ans:null}}
  else{const c=pick(DECK.zh.filter(x=>sylCount(x.py)===2)),v=pyVariants(c.py); TD={say:c.term,correct:v.correct,opts:v.opts,reveal:c.term,c,ans:null}}
}
function ToneDrill(){
  if(!TD) newTD();
  const root=h("div",{class:"stack"});
  root.append(h("h2",{},"Luyện nghe thanh điệu"),h("p",{class:"muted"},"Nghe rồi chọn pinyin đúng. Luyện vài phút mỗi ngày, tai sẽ quen thanh rất nhanh."),legend());
  const vn=voiceNote("zh"); if(vn) root.append(vn);
  const o=h("div",{class:"opts grid2"});
  TD.opts.forEach(x=>{const cls="opt center pyopt"+(TD.ans?(x===TD.correct?" right":x===TD.ans?" wrong":""):"");
    o.append(h("button",{class:cls,disabled:!!TD.ans,onclick:()=>{TD.ans=x;tdScore.t++;const ok=x===TD.correct;if(ok){tdScore.r++;addXP(1)}beep(ok);render();say(TD.say,"zh")}},py(x,"keep")))});
  root.append(h("div",{class:"panel stack"},playPadTD(),o,
    TD.ans?h("div",{class:"ex"},h("div",{class:"row"},h("span",{class:"t han",style:"font-size:24px"},TD.reveal),py(TD.correct,"keep big")),TD.c?h("span",{class:"v"},TD.c.vi):null):null,
    h("div",{class:"row between"},h("span",{class:"score"},`Đúng ${tdScore.r}/${tdScore.t}`),
      h("button",{class:"btn"+(TD.ans?" primary":""),onclick:()=>{newTD();render();say(TD.say,"zh")}},TD.ans?"Câu tiếp theo":"Bỏ qua"))));
  return root;
}
function playPadTD(){const b=h("button",{class:"bigplay","aria-label":"Nghe"});b.innerHTML=ICONS.spk;b.onclick=()=>say(TD.say,"zh");
  return h("div",{class:"player",style:"align-items:center"},b,h("button",{class:"btn",onclick:()=>say(TD.say,"zh",true)},"Nghe chậm"))}

/* ================= AI CHAT (chỉ chạy trong Claude) ================= */
let sampleFn,sampleReady=false,sampleBlocked=false;
(async()=>{try{if(window.claude){sampleFn=await claude.use("sample")}}catch(e){} sampleReady=true; if(tab==="practice"&&pr==="chat") render()})();
let CH={zh:{scen:null,turns:[],busy:false,hint:null},en:{scen:null,turns:[],busy:false,hint:null}},ctl=null;
function rules(sc){
  const zh=lang==="zh";
  return `You are a role-play partner helping a Vietnamese adult practise ${zh?"Mandarin Chinese (simplified characters)":"English"}. The learner works in steel and industrial-equipment trading and is at level: ${S.settings.level}.
Scenario: ${sc.d}
You play: ${sc.role}. The learner plays the Vietnamese customer/visitor. Stay in character.
Keep each reply to 1–3 short sentences. Match the learner's level but use real trade terms naturally. Ask a question to keep the conversation going.
The learner may write in ${zh?"Chinese (characters or pinyin)":"English"}, or in Vietnamese when stuck. Always reply in character in ${zh?"Chinese":"English"}.
Reply in EXACTLY this format, each label at the start of its own line, no markdown, nothing else:
REPLY: <your in-character reply>
${zh?"PINYIN: <pinyin with tone marks for REPLY>\n":""}VI: <Vietnamese translation of REPLY>
FIX: <in Vietnamese. If the learner's last message had mistakes, was unnatural, or was in Vietnamese, give the correct natural ${zh?"Chinese (with pinyin)":"English"} version and a one-line reason. Otherwise write exactly: Tốt>`;
}
function parse(text){
  const get=k=>{const m=text.match(new RegExp("^"+k+":\\s*([\\s\\S]*?)(?=^\\s*(?:REPLY|PINYIN|VI|FIX|SAY):|$(?![\\s\\S]))","m")); return m?m[1].trim():""};
  const r={reply:get("REPLY")||get("SAY"),py:get("PINYIN"),vi:get("VI"),fix:get("FIX")};
  if(!r.reply&&!r.vi) r.reply=text.trim(); return r;
}
function errCopy(e){
  const c=e&&e.code;
  if(["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(c)){sampleBlocked=true;return "Tính năng AI chưa được cho phép trong lần mở này."}
  if(c==="rate_limited") return "Bạn gửi hơi nhanh hoặc đã chạm giới hạn sử dụng. Đợi một lát rồi thử lại.";
  if(c==="session_expired") return "Phiên đăng nhập đã hết. Hãy đăng nhập lại Claude.";
  if(c==="refused") return "AI không trả lời câu này. Thử diễn đạt khác.";
  return "Kết nối bị gián đoạn. Bấm gửi lại.";
}
async function ask(extraUser){
  const st=CH[lang]; if(st.busy) return; const sc=SCEN[lang].find(s=>s.id===st.scen);
  if(extraUser) st.turns.push({role:"user",content:extraUser});
  const ai={role:"assistant",content:"",pending:true}; st.turns.push(ai); st.busy=true; st.hint=null; render();
  ctl=new AbortController();
  const msgs=[{role:"user",content:rules(sc)},{role:"user",content:"(Bắt đầu: hãy mở đầu cuộc hội thoại.)"}];
  st.turns.filter(t=>!t.pending).slice(-16).forEach(t=>msgs.push({role:t.role,content:t.content}));
  if(msgs[msgs.length-1].role!=="user") msgs.push({role:"user",content:"(Tiếp tục.)"});
  try{const r=await sampleFn(msgs,{modelTier:"quick",cache:false,signal:ctl.signal,onText:({text})=>{ai.content=text;const el=document.getElementById("pendingMsg");if(el)el.querySelector(".t").textContent=parse(text).reply||"…"}});
    ai.content=r.text; ai.pending=false; dayRec().chat++; addXP(1);
  }catch(e){st.turns.pop(); if(e&&e.code!=="cancelled") st.error=errCopy(e)}
  st.busy=false; render();
  const last=st.turns[st.turns.length-1];
  if(last&&last.role==="assistant"&&S.settings.autoSpeak!==false) say(parse(last.content).reply,lang);
}
async function hint(){
  const st=CH[lang]; if(st.busy) return; st.busy=true; st.hint={loading:true}; render();
  const sc=SCEN[lang].find(s=>s.id===st.scen),zh=lang==="zh";
  const convo=st.turns.map(t=>(t.role==="user"?"LEARNER: ":"PARTNER: ")+(t.role==="user"?t.content:parse(t.content).reply)).join("\n");
  const prompt=`A Vietnamese learner (level: ${S.settings.level}) is practising ${zh?"Mandarin Chinese":"English"} in this role-play: ${sc.d}
Conversation so far:
${convo||"(nothing yet)"}
Suggest ONE natural, short reply the learner could say next, at their level.
Answer in EXACTLY this format, nothing else:
SAY: <the reply in ${zh?"Chinese characters":"English"}>
${zh?"PINYIN: <pinyin with tone marks>\n":""}VI: <Vietnamese meaning>`;
  try{const r=await sampleFn(prompt,{modelTier:"quick",cache:false}); st.hint=parse(r.text)}
  catch(e){st.hint=null; if(e&&e.code!=="cancelled") st.error=errCopy(e)}
  st.busy=false; render();
}
function Chat(){
  const st=CH[lang],root=h("div",{class:"stack"}),zh=lang==="zh";
  root.append(h("h2",{},`Hội thoại AI · ${LN[lang]}`),h("p",{class:"muted"},"Chọn một tình huống. AI đóng vai đối tác, trả lời kèm phiên âm và nghĩa, đồng thời sửa câu của bạn."));
  if(!sampleReady){root.append(h("p",{class:"note"},"Đang kết nối AI…"));return root}
  if(!sampleFn||sampleBlocked){root.append(h("p",{class:"note"},window.claude?"Tính năng hội thoại AI cần bạn cho phép dùng AI trong Claude.":"Hội thoại AI chưa bật trên bản web này, vì cần kết nối app với AI qua API key. Các phần Học, Ôn tập, Nghe, Nói, Thanh điệu đều dùng được ngay."));return root}
  const grid=h("div",{class:"scen"});
  SCEN[lang].forEach(sc=>grid.append(h("button",{"aria-pressed":st.scen===sc.id,disabled:st.busy,onclick:()=>{if(st.scen===sc.id)return;st.scen=sc.id;st.turns=[];st.hint=null;st.error=null;ask()}},h("b",{},sc.t),h("span",{},sc.d))));
  root.append(grid); if(!st.scen) return root;
  const log=h("div",{class:"log panel"});
  st.turns.forEach((t,ti)=>{
    if(t.role==="user"){log.append(h("div",{class:"msg me"},h("span",{class:"t"},t.content)));return}
    const p=parse(t.content);
    if(t.pending){log.append(h("div",{class:"msg ai",id:"pendingMsg"},h("span",{class:"t"+(zh?" han":"")},p.reply||"Đang nghĩ…")));return}
    const good=!p.fix||/^tốt\.?$/i.test(p.fix.trim());
    log.append(h("div",{class:"msg ai"},h("div",{class:"head"},h("span",{class:"t"+(zh?" han":"")},p.reply),speakBtn(p.reply,lang)),
      p.py?py(p.py):null,p.vi?h("span",{class:"v"},p.vi):null,
      ti>0&&p.fix?h("div",{class:"fix"+(good?" good":"")},good?"Câu của bạn ổn.":"Sửa: "+p.fix):null));
  });
  root.append(log);
  if(st.error) root.append(h("p",{class:"note"},st.error));
  if(st.hint) root.append(st.hint.loading?h("div",{class:"hint"},"Đang tìm gợi ý…"):h("div",{class:"hint"},
    h("div",{class:"row between",style:"flex-wrap:nowrap"},h("span",{class:zh?"han":"",style:"font-size:17px"},st.hint.reply),speakBtn(st.hint.reply,lang)),
    st.hint.py?py(st.hint.py):null,h("span",{class:"muted small"},st.hint.vi)));
  const ta=h("textarea",{id:"chatIn",rows:"2",placeholder:zh?"Gõ tiếng Trung, pinyin hoặc tiếng Việt…":"Type in English (or Vietnamese if stuck)…",disabled:st.busy});
  const send=()=>{const v=ta.value.trim(); if(!v) return; st.error=null; ask(v)};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
  root.append(h("div",{class:"compose"},ta,h("button",{class:"btn primary",disabled:st.busy,onclick:send},"Gửi")),
    h("div",{class:"row"},h("button",{class:"btn",disabled:st.busy,onclick:hint},"Gợi ý câu trả lời"),
      st.busy?h("button",{class:"btn ghost",onclick:()=>ctl&&ctl.abort()},"Dừng"):null,
      h("button",{class:"btn ghost",disabled:st.busy,onclick:()=>{st.turns=[];st.hint=null;st.error=null;ask()}},"Bắt đầu lại")));
  return root;
}

/* ================= SETTINGS ================= */
function Settings(){
  const st=S.settings,root=h("div",{class:"stack"});
  const sel=(id,label,val,opts,on)=>h("label",{class:"field",for:id},label,
    (()=>{const s=h("select",{id}); opts.forEach(([v,t])=>{const o=h("option",{value:v},t); if(String(v)===String(val)) o.selected=true; s.append(o)}); s.onchange=()=>on(s.value); return s})());
  const sample=()=>say(lang==="zh"?"你好，很高兴认识你。":"Nice to meet you.",lang);
  root.append(h("h2",{},"Cài đặt"),
    h("div",{class:"panel stack"},h("h3",{},"Học tập"),
      sel("setMain","Ngôn ngữ chính (70% thời gian)",st.main,[["zh","Tiếng Trung"],["en","Tiếng Anh"]],v=>{st.main=v;save();render()}),
      sel("setGoal","Mục tiêu mỗi ngày",st.goal,[[20,"20 điểm · nhẹ nhàng (~10 phút)"],[30,"30 điểm · vừa phải (~15 phút)"],[50,"50 điểm · chăm chỉ (~25 phút)"],[80,"80 điểm · chuyên sâu (~40 phút)"]],v=>{st.goal=+v;save()}),
      sel("setLevel","Trình độ (để AI nói cho vừa sức)",st.level,[["Mới bắt đầu","Mới bắt đầu"],["Sơ trung cấp","Sơ trung cấp"],["Trung cấp","Trung cấp"],["Khá","Khá"]],v=>{st.level=v;save()})),
    h("div",{class:"panel stack"},h("h3",{},"Hiển thị"),
      sel("setPy","Pinyin",st.showPy===false?"0":"1",[["1","Hiện pinyin"],["0","Ẩn pinyin (tự kiểm tra đọc chữ Hán)"]],v=>{st.showPy=v==="1";save();render()}),
      sel("setTone","Tô màu pinyin theo thanh điệu",st.toneColor===false?"0":"1",[["1","Bật"],["0","Tắt"]],v=>{st.toneColor=v==="1";save();render()}),
      legend()),
    h("div",{class:"panel stack"},h("h3",{},"Âm thanh"),
      sel("setVoice","Giọng đọc",st.voice||"auto",[["auto","Tự động (khuyên dùng)"],["device","Giọng có sẵn trong máy (chạy offline)"],["online","Giọng online (cần mạng)"]],v=>{st.voice=v;save();sample()}),
      sel("setRate","Tốc độ giọng đọc",st.rate,[[0.8,"Chậm"],[1,"Bình thường"],[1.15,"Nhanh"]],v=>{st.rate=+v;save()}),
      h("button",{class:"btn",style:"align-self:flex-start",onclick:sample},"Thử giọng đọc"),
      sel("setSfx","Âm báo đúng/sai",st.sfx===false?"0":"1",[["1","Bật"],["0","Tắt"]],v=>{st.sfx=v==="1";save();beep(true)}),
      sel("setAuto","Tự đọc to câu trả lời của AI",st.autoSpeak===false?"0":"1",[["1","Bật"],["0","Tắt"]],v=>{st.autoSpeak=v==="1";save()})),
    h("p",{class:"note"},docRef?"Tiến độ được lưu vào tài khoản Claude của bạn, mở ở máy khác vẫn còn.":"Tiến độ được lưu trên trình duyệt này. Laptop và điện thoại lưu riêng."));
  if(!window.claude){
    const msg=h("span",{class:"muted small"});
    const file=h("input",{type:"file",id:"importFile",accept:".json,application/json",hidden:true});
    file.onchange=()=>{const f=file.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{try{const d=JSON.parse(rd.result); if(!d.cards||!d.settings) throw 0; S=loadState(d); lang=S.settings.main; save(); render()}catch(e){msg.textContent="File không đúng định dạng sao lưu của app."}}; rd.readAsText(f)};
    root.append(h("div",{class:"panel stack"},h("h3",{},"Sao lưu tiến độ"),
      h("p",{class:"muted small"},"Tải file sao lưu để giữ tiến độ khi đổi máy hoặc xóa dữ liệu trình duyệt. Muốn chuyển tiến độ từ laptop sang điện thoại: tải file ở laptop, gửi sang điện thoại, rồi bấm Nạp file."),
      h("div",{class:"row"},
        h("button",{class:"btn",onclick:()=>{const a=h("a",{href:URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"})),download:"tien-do-hoc-"+today()+".json"}); document.body.append(a); a.click(); a.remove(); msg.textContent="Đã tải file sao lưu."}},"Tải file sao lưu"),
        h("button",{class:"btn",onclick:()=>file.click()},"Nạp file sao lưu"),file),msg));
  }
  const box=h("div",{class:"row"});
  const b0=h("button",{class:"btn ghost",onclick:()=>box.replaceChildren(h("span",{class:"muted"},"Xóa hết tiến độ học?"),
    h("button",{class:"btn",style:"color:var(--bad)",onclick:()=>{const keep=S.settings;S=fresh();S.settings=keep;save();render()}},"Xóa"),
    h("button",{class:"btn ghost",onclick:()=>box.replaceChildren(b0)},"Hủy"))},"Xóa tiến độ và học lại từ đầu");
  box.append(b0); root.append(box);
  return root;
}
